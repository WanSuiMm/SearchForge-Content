[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchforge-content"
version = "0.1.0"
description = "Versioned public content projection relay and source-validated search API"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
retrieval = [
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
